name: Build and deploy GTA III browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: Configure WebAssembly build
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build re3 WebAssembly runtime
        run: cmake --build build-wasm --target re3_wasm --parallel 4

      - name: Verify browser shell
        run: |
          node --check web/vfs.js
          node --check web/saves.js
          node --check web/input.js
          node --check web/perf.js
          node --check web/boot.js
          node --check web/launcher.js
          python -m json.tool web/asset-manifest.json > /dev/null

      - name: Verify browser bundle
        run: |
          emcc --version
          test -f web/build/re3_wasm.js
          test -f web/build/re3_wasm.wasm
          test -f build-wasm/src/re3_wasm.js.symbols
          test -f web/index.html
          ls -lh web/build/re3_wasm.*
          ls -lh build-wasm/src/re3_wasm.js.symbols

      - name: Upload WASM symbol map
        uses: actions/upload-artifact@v4
        with:
          name: re3-wasm-symbols-${{ github.run_attempt }}
          path: build-wasm/src/re3_wasm.js.symbols
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
