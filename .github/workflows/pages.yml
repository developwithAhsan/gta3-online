name: Build GTA III WebAssembly site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta3-pages-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: Configure WebAssembly build
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build re3 WebAssembly runtime
        run: cmake --build build-wasm --target re3_wasm --parallel 4

      - name: Verify browser audio configuration
        run: |
          grep -q 'set(${PROJECT}_AUDIO "OAL"' CMakeLists.txt
          grep -q -- '-sUSE_MPG123=1' src/CMakeLists.txt
          grep -q 'AUDIO_OAL_USE_MPG123' src/CMakeLists.txt
          grep -q '"path": "audio/sfx.SDT"' web/asset-manifest.json
          grep -q '"path": "audio/sfx.RAW"' web/asset-manifest.json
          if grep -q 'top === "audio"' web/vfs.js; then
            echo "ERROR: VFS is still skipping the AUDIO folder"
            exit 1
          fi

      - name: Verify fullscreen input behavior
        run: |
          grep -q 'DOUBLE_ESCAPE_MS = 750' web/index.html
          grep -q 'event.code !== "Escape"' web/index.html
          grep -q 'double Esc exits game' web/input.js
          grep -q 'cursor: none !important' web/styles.css

      - name: Verify homepage community and slideshow
        run: |
          test -s web/images/about-051.webp
          test -s web/images/about-042.webp
          test -s web/images/about-021.webp
          test -s web/images/about-008.jpg
          test -s web/images/about-001.webp
          grep -q 'id="discussion"' web/index.html
          grep -q 'id="disqus_thread"' web/index.html
          grep -q "gta3-1.disqus.com/embed.js" web/index.html
          grep -q "gta3-online-homepage" web/index.html
          grep -q 'touch-controls.js' web/index.html
          grep -q 'gta3-touch-hud' web/touch-controls.js
          grep -q 'joystick: { size: 24.5' web/touch-controls.js
          grep -q 'accelerate: { size: 17.0' web/touch-controls.js
          grep -q 'desktopPx:' web/touch-controls.js
          grep -q 'touch-sensitivity-input' web/index.html
          grep -q 'gta3.touchSensitivity' web/index.html
          grep -q 'gta3-touch-sensitivity-change' web/touch-controls.js
          grep -q 'sensitivityCurve' web/touch-controls.js
          grep -q 'styles.css?v=20260922-touch3' web/index.html
          test -f web/google2a5cf9fe117640c7.html
          grep -q 'google-site-verification: google2a5cf9fe117640c7.html' web/google2a5cf9fe117640c7.html
          grep -q 'joystick: 180' web/touch-controls.js
          grep -q 'accelerate: 116' web/touch-controls.js
          grep -q 'enabledMode !== "off"' web/touch-controls.js
          grep -q 'touch-controls.js?v=20260922-touch5' web/index.html
          grep -q 're3_BrowserTouchSet' src/core/Pad.cpp
          ! grep -R -i -E "webynize|wbnz-comments|widgets\.webynize\.com" web
          test "$(grep -o 'about-slide about-slide-' web/index.html | wc -l)" -eq 5
          grep -q '@keyframes aboutScreenshotFade' web/styles.css
          grep -q 'images/about-051.webp' web/styles.css
          grep -q 'images/about-001.webp' web/styles.css

      - name: Verify browser bundle
        run: |
          node --check web/vfs.js
          node --check web/asset-source.js
          node --check web/opfs-cache.js
          node --check web/opfs-cache-worker.js
          node --check cloudflare-worker/worker.js
          node --check web/saves.js
          node --check web/save-manager.js
          node --check web/mod-manager.js
          node --check web/zip-workspace.js
          node --check web/input.js
          node --check web/touch-controls.js
          node --check web/perf.js
          node --check web/boot.js
          node --check web/launcher.js
          python -m json.tool web/asset-manifest.json > /dev/null
          test -f web/index.html
          test -s web/build/re3_wasm.js
          test -s web/build/re3_wasm.wasm
          echo "WASM bundle:"
          ls -lh web/build/re3_wasm.*

      - name: Run SEO audit
        run: python scripts/seo_audit.py

      - name: Prepare GitHub Pages files
        run: |
          touch web/.nojekyll
          test -f web/robots.txt
          test -f web/sitemap.xml

      - name: Publish site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gta3-pages
          mkdir -p /tmp/gta3-pages
          cp -a web/. /tmp/gta3-pages/
          cd /tmp/gta3-pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy GTA III browser site from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages


      - name: Deployment summary
        run: |
          echo "### GTA III browser build published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published branch: \`gh-pages\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- WASM and JavaScript bundle verified before publish." >> "$GITHUB_STEP_SUMMARY"
          echo "- If Pages is not enabled yet, set Settings → Pages → Deploy from a branch → gh-pages / (root)." >> "$GITHUB_STEP_SUMMARY"
