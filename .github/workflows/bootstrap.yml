name: Bootstrap GTA3-WASM mirror

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    if: github.event.head_commit.message == 'Bootstrap GTA3-WASM mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone latest GTA3-WASM source
        run: |
          git clone --depth 1 --branch main https://github.com/developwithAhsan/GTA3-WASM.git source
          git -C source rev-parse HEAD

      - name: Mirror source tree
        run: |
          SUBMODULE_SHA="$(git -C source ls-tree HEAD emsdk | awk '{print $3}')"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            source/ ./
          rm -rf source emsdk

          git add -A -- . ':(exclude).github/workflows/**'
          if [ -n "$SUBMODULE_SHA" ]; then
            git update-index --add --cacheinfo 160000,$SUBMODULE_SHA,emsdk
          fi

      - name: Commit mirrored project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import latest GTA3-WASM project"
          git push origin main
